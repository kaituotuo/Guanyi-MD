  <div class="application">
    <header class="titlebar">
      <div class="identity"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><strong>观绎</strong><span>俯仰观物，译述我心</span></div>

      <button id="theme-button" class="icon-button" aria-label="切换深浅主题" title="切换深浅主题"><svg><use href="#i-moon"/></svg></button>
    </header>
    <div class="workspace">
      <aside class="library" id="library" aria-label="学习专题与文档">
        <div class="library-top"><span class="eyebrow">我的专题</span><h1>学习与思考<span class="topic-dot"></span></h1><p>适用于各学科 · 当前示例：运动健康</p></div>
        <div class="library-group-title"><svg><use href="#i-folder"/></svg>学习资料<span>02</span></div>
        <button class="library-document active" data-document="paper"><span class="pdf-type">PDF</span><span><strong>训练干预与功能表现</strong><small>论文示例 · 8 页</small></span><span class="doc-stage-dot" id="dot-paper"></span></button>
        <button class="library-document" data-document="textbook"><span class="pdf-type">PDF</span><span><strong>运动生理学</strong><small>教材示例 · 186 页</small></span><span class="doc-stage-dot" id="dot-textbook"></span></button>
        <div class="outline-heading"><span id="outline-label">文档结构</span><span class="muted-small" id="outline-note">检视后可用</span></div>
        <nav id="outline" aria-label="PDF 结构"></nav>
        <div class="library-bottom"><div><svg><use href="#i-target"/></svg><span>今天的学习目标</span></div><p id="learning-goal">判断一项训练干预研究的结果能不能用在我关心的人群上。</p><button id="goal-button">编辑目标 <span>↗</span></button></div>
      </aside>
      <main class="reading-column">
        <div class="reader-toolbar"><div class="toolbar-left"><button class="icon-button" id="library-toggle" aria-label="展开或收起文档目录" title="文档目录"><svg><use href="#i-menu"/></svg></button><span class="toolbar-divider"></span><button class="icon-button" id="previous-page" aria-label="上一页"><svg><use href="#i-left"/></svg></button><label class="page-input-wrap"><input id="page-input" type="number" min="1" value="5" aria-label="当前页码"><span id="total-pages">/ 8</span></label><button class="icon-button" id="next-page" aria-label="下一页"><svg><use href="#i-right"/></svg></button></div><div class="toolbar-right"><select id="zoom-select" aria-label="页面显示比例"><option value="fit">适合页宽</option><option value="0.9">90%</option><option value="1">100%</option><option value="1.15">115%</option></select><button class="study-toggle" id="study-toggle" aria-expanded="true"><svg><use href="#i-spark"/></svg><span>智能研读</span></button></div></div>
        <div class="stage-bar" id="stage-bar" aria-label="阅读档位"></div>
        <div class="reading-meta"><span id="reading-breadcrumb">研究示例 · 结果与不确定性</span><button id="return-button" hidden><svg><use href="#i-back"/></svg>返回阅读位置</button><span class="read-state" id="read-state"><span></span>文字层可用</span></div>
        <div class="paper-scroll" id="paper-scroll"><article class="pdf-page" id="pdf-page" aria-label="PDF 演示页面"></article></div>
        <div class="reader-footer"><span id="document-footer">原文排版视图 · 演示资料</span><span id="footer-hint">进入精读档后，术语与数值可点</span></div>
      </main>
      <aside class="study-panel" id="study-panel" aria-label="智能研读面板">
        <div class="study-heading"><div><svg><use href="#i-spark"/></svg><h2>智能研读</h2></div><button class="icon-button" id="study-close" aria-label="收起智能研读"><svg><use href="#i-close"/></svg></button></div>
        <div class="panel-tabs" role="tablist" aria-label="智能研读功能"><button role="tab" aria-selected="true" data-panel="guide">导读</button><button role="tab" aria-selected="false" data-panel="ask">文档对话</button><button role="tab" aria-selected="false" data-panel="digest">研读纪要<span id="digest-count">0</span></button></div>
        <div class="panel-content" id="panel-content" role="tabpanel" tabindex="0"></div>
        <div class="panel-footer"><svg><use href="#i-check"/></svg><span>原文与解释分开呈现 · 引用可回到页面</span></div>
      </aside>
    </div>
    <footer class="app-status"><span><span class="status-dot"></span>本地演示 · 纪要保存在当前浏览器</span><div><label for="scenario-select">预览状态</label><select id="scenario-select"><option value="ready">正常</option><option value="partial">部分可用（前 5 页）</option><option value="scan">扫描件 · 无文字层</option></select><button id="reset-button">重置演示</button></div></footer>

  <div id="term-pop" class="floating-card" hidden></div>
  <div id="value-pop" class="floating-card" hidden></div>
